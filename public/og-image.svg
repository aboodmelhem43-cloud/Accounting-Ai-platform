<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f8eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9b6fff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>
  <!-- Glow -->
  <ellipse cx="600" cy="315" rx="420" ry="260" fill="#4f8eff" opacity="0.07"/>
  <!-- Logo mark -->
  <rect x="100" y="210" width="56" height="56" rx="14" fill="url(#accent)"/>
  <text x="128" y="249" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="white" text-anchor="middle">M</text>
  <!-- Brand name -->
  <text x="172" y="249" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="white">Mohasab</text>
  <text x="400" y="249" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#9b6fff">Ai</text>
  <!-- Tagline EN -->
  <text x="100" y="310" font-family="Arial,sans-serif" font-size="52" font-weight="800" fill="white">Smart Accounting</text>
  <text x="100" y="375" font-family="Arial,sans-serif" font-size="52" font-weight="800" fill="url(#accent)">for Arab Businesses</text>
  <!-- Tagline AR -->
  <text x="1100" y="445" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#94a3b8" text-anchor="end">محاسبة ذكية للأعمال العربية</text>
  <!-- Features row -->
  <text x="100" y="510" font-family="Arial,sans-serif" font-size="22" fill="#64748b">AI Invoice Scanning  ·  Double-Entry Ledger  ·  8 Arab Countries  ·  35-Day Free Trial</text>
</svg>

  .filter-btn {

  }
  .filter-btn:hover { border-color: var(--brand); color: var(--brand); }
  .filter-btn.active { background: var(--brand); border-color: var(--brand); color: #fff; }

    font-family: 'Playfair Display', serif; font-size: 13px; font-weight: 700;

  .post-card {
    background: var(--card); border-radius: 0 0 var(--radius) var(--radius);
    box-shadow: var(--shadow); border: 1.5px solid var(--border);

    position: relative;
  }
  .post-thumb { box-shadow: var(--shadow); border: 1.5px solid var(--border); border-bottom: none; }
  .post-whole { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }

  .post-day {
    font-family: 'Playfair Display', serif; font-size: 18px;
    font-weight: 900; color: var(--ink); line-height: 1;
  }
  .post-type-badge {
    display: inline-flex; align-items: center; gap: 4px;

  .modal-preview-col {
    padding: 24px; background: var(--ground);

    flex-direction: column; gap: 12px; align-items: center;
    justify-content: flex-start;

  .preview-label {
    font-size: 11px; font-weight: 700; letter-spacing: .1em;

  .modal-text-col { padding: 24px 28px; display: flex; flex-direction: column; gap: 0; }
  .modal-head {
    display: flex; align-items: flex-start;
    justify-content: space-between; gap: 12px; margin-bottom: 20px;
  }
  .modal-day-num {
    font-family: 'Playfair Display', serif; font-size: 36px;
    font-weight: 900; line-height: 1; color: var(--ink);

  .modal-day-sub { font-size: 12px; color: var(--ink-3); font-weight: 500; margin-top: 2px; }
  .close-btn {

  .close-btn:hover { background: var(--border); }

  .lang-tabs { display: flex; gap: 4px; margin-bottom: 14px; }
  .lang-tab {
    border: 1.5px solid var(--border); background: transparent;
    color: var(--ink-2); font-size: 12px; font-weight: 600;

  .divider { height: 1px; background: var(--border); margin: 14px 0; }

  .hashtag-label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }

  .legend { max-width: 880px; margin: 0 auto 28px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

  .format-row {

  .format-badge {

  .format-badge.static { background:#F0FDF4; color:#15803D; border-color:#86EFAC; }

  [data-theme="dark"] .format-badge.carousel { background:#451A03; color:#FCD34D; border-color:#78350F; }

  .best-time-pill {
    font-size: 11.5px; color: var(--ink-3); display: flex; align-items: center; gap: 4px;
  }

  .format-overlay {
    position: absolute; top: 7px; left: 7px; z-index: 2;
    font-size: 10px; font-weight: 700; letter-spacing: .04em;
    padding: 3px 8px; border-radius: 100px; pointer-events: none;

    font-size: 11px; color: var(--ink-3); text-align: right; margin-top: -4px;

  }
  .char-count.warn { color: #D97706; }
  .char-count.over { color: #DC2626; font-weight: 700; }

  .slide-hint {
    font-size: 11.5px; color: var(--ink-3); font-style: italic; margin-top: -8px;
  }
</style>

const TYPE_LABELS = { feature:"Feature", tip:"Tip", engage:"Engage", cta:"CTA", story:"Story", country:"Country" };

const PALETTE = {
  feature: { g1:"#1D4ED8", g2:"#3B82F6", light:"#DBEAFE", dark:"#1E3A8A" },
  tip:     { g1:"#059669", g2:"#10B981", light:"#D1FAE5", dark:"#064E3B" },
  engage:  { g1:"#7C3AED", g2:"#8B5CF6", light:"#EDE9FE", dark:"#4C1D95" },
  cta:     { g1:"#EA580C", g2:"#F97316", light:"#FFEDD5", dark:"#7C2D12" },
  story:   { g1:"#0891B2", g2:"#06B6D4", light:"#CFFAFE", dark:"#164E63" },
  country: { g1:"#D97706", g2:"#F59E0B", light:"#FEF3C7", dark:"#78350F" },
};

const WEEKS = [
  { label:"Week 1 — Days 1–7",  days:[1,2,3,4,5,6,7] },
  { label:"Week 2 — Days 8–14", days:[8,9,10,11,12,13,14] },

// Content creator metadata
const FORMATS = {
  1:"reel", 2:"carousel", 3:"reel", 4:"static", 5:"reel",
  6:"carousel", 7:"carousel", 8:"carousel", 9:"reel", 10:"reel",
  11:"static", 12:"carousel", 13:"carousel", 14:"reel", 15:"carousel",
  16:"carousel", 17:"reel", 18:"static", 19:"reel", 20:"carousel",
  21:"carousel", 22:"carousel", 23:"carousel", 24:"reel", 25:"static",
  26:"reel", 27:"carousel", 28:"carousel", 29:"reel", 30:"reel",
};

const BEST_TIMES = {
  1:"الأحد 7–9م", 2:"الاثنين 12–2م", 3:"الثلاثاء 7–9م", 4:"الأربعاء 6–8م", 5:"الخميس 8–10م",
  6:"الجمعة 9–11ص", 7:"السبت 12–2م", 8:"الأحد 7–9م", 9:"الاثنين 12–2م", 10:"الثلاثاء 7–9م",
  11:"الأربعاء 6–8م", 12:"الخميس 12–2م", 13:"الجمعة 9–11ص", 14:"السبت 7–9م", 15:"الأحد 12–2م",
  16:"الاثنين 7–9م", 17:"الثلاثاء 7–9م", 18:"الأربعاء 6–8م", 19:"الخميس 8–10م", 20:"الجمعة 9–11ص",
  21:"السبت 12–2م", 22:"الأحد 7–9م", 23:"الاثنين 12–2م", 24:"الثلاثاء 7–9م", 25:"الأربعاء 6–8م",
  26:"الخميس 8–10م", 27:"الجمعة 9–11ص", 28:"السبت 12–2م", 29:"الأحد 7–9م", 30:"الاثنين 12–2م",
};

const FORMAT_LABELS = { reel:"🎬 ريل", carousel:"🎠 كاروسيل", static:"📸 صورة ثابتة" };
const FORMAT_LABELS_EN = { reel:"🎬 Reel", carousel:"🎠 Carousel", static:"📸 Static" };

// ── Canvas renderer: Dark Premium style ──
function drawPost(canvas, post) {
  const S = 1080;
  canvas.width = S; canvas.height = S;
  const ctx = canvas.getContext('2d');
  const pal = PALETTE[post.type];

  // BACKGROUND: deep dark with subtle brand hue
  const bgGrd = ctx.createLinearGradient(0, 0, S * 0.8, S);
  bgGrd.addColorStop(0, '#060C18');
  bgGrd.addColorStop(1, pal.dark);
  ctx.fillStyle = bgGrd;
  ctx.fillRect(0, 0, S, S);

  // Brand-colored glow — top-right
  const glow1 = ctx.createRadialGradient(S * 0.88, 0, 0, S * 0.88, 0, S * 0.70);
  glow1.addColorStop(0, pal.g1 + '4D'); // ~30%
  glow1.addColorStop(1, 'transparent');
  ctx.fillStyle = glow1;
  ctx.fillRect(0, 0, S, S);

  // Softer glow — bottom-left
  const glow2 = ctx.createRadialGradient(0, S, 0, 0, S, S * 0.52);
  glow2.addColorStop(0, pal.g2 + '2A'); // ~16%
  glow2.addColorStop(1, 'transparent');
  ctx.fillStyle = glow2;
  ctx.fillRect(0, 0, S, S);

  // Diagonal accent triangle — vivid brand gradient
  ctx.save();
  const stripGrd = ctx.createLinearGradient(0, 0, S * 0.58, S * 0.52);
  stripGrd.addColorStop(0, pal.g2 + 'BF'); // ~75%
  stripGrd.addColorStop(1, pal.g1 + '22'); // ~13%
  ctx.fillStyle = stripGrd;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(S * 0.58, 0); ctx.lineTo(0, S * 0.52);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // Oversized day number (white watermark, very subtle)
  ctx.save();
  ctx.globalAlpha = 0.055;
  ctx.font = `bold 560px "Noto Sans", sans-serif`;
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.fillText(String(post.day).padStart(2, '0'), S + 60, S + 90);
  ctx.restore();

  // TOP NAV BAR
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  roundRect(ctx, 48, 48, 62, 62, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 1;
  roundRect(ctx, 48, 48, 62, 62, 14); ctx.stroke();
  ctx.font = `bold 36px "Noto Sans", sans-serif`;
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('M', 79, 79);

  ctx.font = `700 30px "Noto Sans", sans-serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('MohasabAi', 124, 72);

  // Brand accent underline
  const ulGrd = ctx.createLinearGradient(124, 0, 124 + 160, 0);
  ulGrd.addColorStop(0, pal.g2);
  ulGrd.addColorStop(1, 'transparent');
  ctx.fillStyle = ulGrd;
  ctx.fillRect(124, 93, 160, 2);


  // HEADLINE BLOCK (vertically centered)
  const arLines = post.headline.split('\n');
  const enLines = post.enHeadline.split('\n');
  const arSize = 92;
  const arLineH = 110;
  const enSize = 50;
  const enLineH = 62;
  const divGap = 32;

  const totalH = arLines.length * arLineH + divGap + 4 + divGap + enLines.length * enLineH;
  const blockTop = Math.round((S - totalH) / 2) - 10;

  // Arabic — white, bold
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = `bold ${arSize}px "Noto Sans Arabic", "Noto Sans", sans-serif`;
  ctx.fillStyle = '#FFFFFF';
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 22;
  arLines.forEach((line, i) => {
    ctx.fillText(line, S / 2, blockTop + i * arLineH);
  });
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

  // Brand-colored divider (gradient fade)
  const divY = blockTop + arLines.length * arLineH + divGap;
  const dGrd = ctx.createLinearGradient(S / 2 - 130, 0, S / 2 + 130, 0);
  dGrd.addColorStop(0, 'transparent');
  dGrd.addColorStop(0.25, pal.g2);
  dGrd.addColorStop(0.75, pal.g1);
  dGrd.addColorStop(1, 'transparent');
  ctx.fillStyle = dGrd;
  ctx.fillRect(S / 2 - 130, divY, 260, 4);

  // English — muted white
  const enY0 = divY + 4 + divGap;
  ctx.font = `600 ${enSize}px "Noto Sans", sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.72)';
  enLines.forEach((line, i) => {
    ctx.fillText(line, S / 2, enY0 + i * enLineH);
  });

  // BOTTOM SEPARATOR LINE
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(48, S - 96, S - 96, 1);

  // URL
  ctx.font = '500 26px "Noto Sans", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillText('www.mohasabai.com', 52, S - 42);

  // Hashtags in brand color
  ctx.font = '500 24px "Noto Sans Arabic", "Noto Sans", sans-serif';
  ctx.fillStyle = pal.g2 + 'BB';
  ctx.textAlign = 'right';
  ctx.fillText('#محاسب_AI  #MohasabAi', S - 52, S - 42);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ── Build calendar ──
const cal = document.getElementById('calendar');

function buildCalendar() {
  cal.innerHTML = '';
  for (const week of WEEKS) {
    const sec = document.createElement('div');
    sec.className = 'week';
    const wl = document.createElement('div');
    wl.className = 'week-label';
    wl.textContent = week.label;
    sec.appendChild(wl);
    const grid = document.createElement('div');
    grid.className = 'week-grid';

    for (const dayNum of week.days) {
      const post = POSTS.find(p => p.day === dayNum);
      if (!post) continue;

      const wrap = document.createElement('div');
      wrap.className = `post-wrap type-${post.type}`;
      wrap.dataset.type = post.type;

      const whole = document.createElement('div');
      whole.className = 'post-whole';

      const thumbWrap = document.createElement('div');
      thumbWrap.className = 'post-thumb';
      const tc = document.createElement('canvas');
      drawPost(tc, post);
      thumbWrap.appendChild(tc);
      const fmtPill = document.createElement('div');
      const fmtKey = FORMATS[dayNum] || 'static';
      fmtPill.className = `format-overlay ${fmtKey}`;
      fmtPill.textContent = FORMAT_LABELS_EN[fmtKey];
      thumbWrap.appendChild(fmtPill);
      thumbWrap.addEventListener('click', () => openModal(post));

      const card = document.createElement('div');
      card.className = 'post-card';
      card.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div class="post-day">${String(dayNum).padStart(2,'0')}</div>
          <div class="post-type-badge">${TYPE_LABELS[post.type]}</div>
        </div>`;
      card.addEventListener('click', () => openModal(post));

      whole.appendChild(thumbWrap);
      whole.appendChild(card);
      wrap.appendChild(whole);
      grid.appendChild(wrap);
    }
    sec.appendChild(grid);
    cal.appendChild(sec);
  }
}

// ── Modal ──
const overlay = document.getElementById('overlay');
const modalCanvas = document.getElementById('modal-canvas');
let currentPost = null;
let currentLang = 'ar';

function openModal(post) {
  currentPost = post;
  currentLang = 'ar';
  document.getElementById('m-day').textContent = String(post.day).padStart(2,'0');
  document.getElementById('m-type-label').textContent = TYPE_LABELS[post.type] + ' · Day ' + post.day;
  const fmt = FORMATS[post.day] || 'static';
  const fmtBadge = document.getElementById('m-format-badge');
  fmtBadge.textContent = FORMAT_LABELS[fmt];
  fmtBadge.className = 'format-badge ' + fmt;
  document.getElementById('m-best-time').textContent = BEST_TIMES[post.day] || '';
  document.getElementById('m-ar').textContent = post.ar;
  document.getElementById('m-en').textContent = post.en;
  document.getElementById('m-tags').textContent = post.tags;
  document.getElementById('m-ar').style.display = '';
  document.getElementById('m-en').style.display = 'none';
  document.getElementById('copy-caption-btn').textContent = 'نسخ';
  document.querySelectorAll('.lang-tab').forEach(t => t.classList.toggle('active', t.dataset.lang === 'ar'));
  const slideHint = document.getElementById('m-slide-hint');
  slideHint.textContent = fmt === 'carousel' ? '💡 يُنصح بـ 5–10 شرائح / Recommended: 5–10 slides' : '';
  drawPost(modalCanvas, post);
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  updateCharCount();
}

function updateCharCount() {
  if (!currentPost) return;
  const text = currentLang === 'ar' ? currentPost.ar : currentPost.en;
  const len = text.length;
  const el = document.getElementById('m-char-count');
  if (len <= 125) {
    el.textContent = `${len} chars — fully visible in feed ✓`;
    el.className = 'char-count';
  } else {
    el.textContent = `${len} chars — first 125 shown, rest hidden behind "more"`;
    el.className = 'char-count warn';
  }
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  currentPost = null;
}

document.getElementById('close-btn').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// Lang tabs
document.querySelectorAll('.lang-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.dataset.lang;
    document.querySelectorAll('.lang-tab').forEach(t => t.classList.toggle('active', t.dataset.lang === currentLang));
    document.getElementById('m-ar').style.display = currentLang === 'ar' ? '' : 'none';
    document.getElementById('m-en').style.display = currentLang === 'en' ? '' : 'none';
    document.getElementById('copy-caption-btn').textContent = currentLang === 'ar' ? 'نسخ' : 'Copy';
    updateCharCount();
  });
});

// Download via capability
let downloadsApi = null;
claude.use("downloads").then(api => { downloadsApi = api; });

document.getElementById('dl-btn').addEventListener('click', async () => {
  if (!currentPost || !downloadsApi) return;
  const btn = document.getElementById('dl-btn');
  btn.textContent = '⏳ Preparing…';
  btn.disabled = true;
  try {
    const blob = await new Promise(res => modalCanvas.toBlob(res, 'image/png'));
    const filename = `mohasabai-day${String(currentPost.day).padStart(2,'0')}-${currentPost.type}.png`;
    await downloadsApi.save({ filename, data: blob });
    btn.textContent = '✓ Saved!';
    setTimeout(() => { btn.textContent = '⬇ Download 1080×1080 Image'; btn.disabled = false; }, 2000);
  } catch (e) {
    btn.textContent = e?.code === 'declined' ? '⬇ Download 1080×1080 Image' : '⚠ Download unavailable';
    btn.disabled = false;
  }
});

// Copy buttons
document.getElementById('copy-caption-btn').addEventListener('click', async () => {
  const text = currentLang === 'ar'
    ? document.getElementById('m-ar').textContent
    : document.getElementById('m-en').textContent;
  await copyText(text, document.getElementById('copy-caption-btn'), currentLang === 'ar' ? 'تم النسخ ✓' : 'Copied ✓');
});
document.getElementById('copy-tags-btn').addEventListener('click', async () => {
  await copyText(document.getElementById('m-tags').textContent, document.getElementById('copy-tags-btn'), 'Copied ✓');
});

async function copyText(text, btn, successLabel) {
  const orig = btn.textContent;
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = successLabel;
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1800);
  } catch {}
}

// Filter
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    document.querySelectorAll('.post-wrap').forEach(el => {
      el.classList.toggle('hidden', f !== 'all' && el.dataset.type !== f);
    });
  });
});

// Wait for Google Fonts before drawing thumbnails
document.fonts.ready.then(() => buildCalendar());
</script>
